name: Python CI/CD Security Pipeline

on:
  push:
    branches:
      - side

  pull_request:
    branches:
      - main

jobs:
  security-and-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
             python -m pip install --upgrade pip setuptools
             pip install -r requirements.txt

      # -------------------------
      # SAST
      # -------------------------

      - name: SAST - Bandit
        run: |
          bandit -r . -f json -o bandit-report.json
        continue-on-error: true

      # -------------------------
      # SCA
      # -------------------------

      - name: SCA - pip-audit
        run: |
          pip-audit

      # -------------------------
      # Code Quality
      # -------------------------

      - name: Lint - Ruff
        run: |
          ruff check .

      # -------------------------
      # Tests
      # -------------------------

      - name: Run tests
        run: |
          pytest